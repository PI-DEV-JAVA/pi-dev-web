# docker-compose.yml
version: "3.9"

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    restart: unless-stopped
    extra_hosts:
    - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - php

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  db:
    image: mysql:8.1
    container_name: pidev_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pidevadmin
      MYSQL_DATABASE: main
      MYSQL_USER: pidev
      MYSQL_PASSWORD: pidev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: pidevadmin
    depends_on:
      - db

volumes:
  mysql_data:
  certbot_certs:
  certbot_www: