security:
  password_hashers:
    App\Entity\User:
      id: App\Security\LegacySha256PasswordHasher

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      user_checker: App\Security\UserChecker
      form_login:
        login_path: app_login
        check_path: app_login
        default_target_path: app_home
        always_use_default_target_path: true
        enable_csrf: true
      logout:
        path: app_logout
        target: app_home
      remember_me:
        secret: "%kernel.secret%"
        lifetime: 604800 # 1 week

  role_hierarchy:
    ROLE_HR: ROLE_CANDIDATE
    ROLE_ADMIN: [ROLE_HR, ROLE_CANDIDATE]

  access_control:
    # Public pages (front office)
    - { path: ^/$, roles: PUBLIC_ACCESS }
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/register, roles: PUBLIC_ACCESS }
    - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
    - { path: ^/offers, roles: PUBLIC_ACCESS }
    - { path: ^/events, roles: PUBLIC_ACCESS }
    - { path: ^/courses, roles: PUBLIC_ACCESS }
    # Admin panel
    - { path: ^/admin, roles: IS_AUTHENTICATED_FULLY }
    # Authenticated user pages
    - { path: ^/account, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/profile, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/my-circle, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/chat, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/interviews, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/support, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/notifications/count, roles: PUBLIC_ACCESS }
    - { path: ^/notifications, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/activities, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/quiz, roles: IS_AUTHENTICATED_FULLY }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
